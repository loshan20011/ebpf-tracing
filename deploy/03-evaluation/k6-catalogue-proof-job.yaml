apiVersion: batch/v1
kind: Job
metadata:
  name: k6-catalogue-proof
  namespace: sock-shop
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.49.0
          command: ["k6", "run", "/scripts/script.js"]
          env:
            - name: BASE_URL
              value: "http://front-end.sock-shop"
            - name: RATE
              value: "400"
            - name: DURATION
              value: "180s"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: k6-catalogue-proof-script
