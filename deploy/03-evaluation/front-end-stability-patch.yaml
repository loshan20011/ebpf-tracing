spec:
  template:
    spec:
      containers:
      - name: front-end
        startupProbe:
          $patch: replace
          tcpSocket:
            port: 8079
          failureThreshold: 60
          periodSeconds: 5
          timeoutSeconds: 1
        readinessProbe:
          $patch: replace
          tcpSocket:
            port: 8079
          periodSeconds: 5
          failureThreshold: 6
          timeoutSeconds: 1
        livenessProbe:
          $patch: replace
          tcpSocket:
            port: 8079
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 1
