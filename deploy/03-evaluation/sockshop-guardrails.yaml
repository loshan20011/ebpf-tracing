apiVersion: v1
kind: LimitRange
metadata:
  name: sock-shop-defaults
  namespace: sock-shop
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sock-shop-quota
  namespace: sock-shop
spec:
  hard:
    pods: "80"
    requests.cpu: "10"
    limits.cpu: "20"
    requests.memory: "20Gi"
    limits.memory: "40Gi"
