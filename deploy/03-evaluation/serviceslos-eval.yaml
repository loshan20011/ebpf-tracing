# ThriveScale Evaluation SLOs (Phase 1)
# Apply when testing ThriveScale controller.
# kubectl apply -f deploy/03-evaluation/serviceslos-eval.yaml

apiVersion: autoscaling.fyp.io/v1alpha1
kind: ServiceSLO
metadata:
  name: eval-cpu-slo
spec:
  targetDeployment: svc-cpu
  # Strict but realistic for CPU-heavy handler
  sloLatency: 50
  minReplicas: 1
  maxReplicas: 10
---
apiVersion: autoscaling.fyp.io/v1alpha1
kind: ServiceSLO
metadata:
  name: eval-io-slo
spec:
  targetDeployment: svc-io
  # IO workloads tolerate higher tail latency
  sloLatency: 100
  minReplicas: 1
  maxReplicas: 10
---
apiVersion: autoscaling.fyp.io/v1alpha1
kind: ServiceSLO
metadata:
  name: eval-fanout-slo
spec:
  targetDeployment: svc-fanout
  # Fanout inherits downstream delays
  sloLatency: 120
  minReplicas: 1
  maxReplicas: 10
