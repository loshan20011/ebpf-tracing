apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-sockshop-mix-script
  namespace: sock-shop
data:
  script.js: |
    import http from 'k6/http';
    import { check } from 'k6';

    const BASE_URL = __ENV.BASE_URL || 'http://front-end.sock-shop';

    export const options = {
      scenarios: {
        ew_mix: {
          executor: 'ramping-arrival-rate',
          startRate: 20,
          timeUnit: '1s',
          preAllocatedVUs: 200,
          maxVUs: 1400,
          stages: [
            { target: 20, duration: '30s' },
            { target: 120, duration: '30s' },
            { target: 220, duration: '30s' },
            { target: 80, duration: '30s' },
            { target: 260, duration: '30s' },
            { target: 40, duration: '30s' },
          ],
        },
      },
      thresholds: {
        http_req_failed: ['rate<1.00'],
      },
    };

    function pickPath() {
      const r = Math.random();
      if (r < 0.60) return '/catalogue';
      if (r < 0.90) return '/cart';
      return '/';
    }

    export default function () {
      const path = pickPath();
      const res = http.get(`${BASE_URL}${path}`, { timeout: '8s' });
      check(res, { 'status<500': (x) => x.status < 500 });
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-sockshop-mix
  namespace: sock-shop
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.49.0
          command: ["k6", "run", "/scripts/script.js"]
          env:
            - name: BASE_URL
              value: "http://front-end.sock-shop"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: k6-sockshop-mix-script
