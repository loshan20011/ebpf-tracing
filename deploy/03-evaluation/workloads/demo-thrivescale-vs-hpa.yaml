phases:
  - start_s: 0
    end_s: 20
    target_rps: 3
  - start_s: 20
    end_s: 100
    target_rps: 12
  - start_s: 100
    end_s: 160
    target_rps: 16
  - start_s: 160
    end_s: 220
    target_rps: 2

routes:
  - name: cpu-hot
    group: cpu
    method: GET
    path: /cpu?count=8000000
    weight: 0.45
  - name: chain-hot
    group: chain
    method: GET
    path: /chain?count=6000000
    weight: 0.20
  - name: fanout-hot
    group: fanout
    method: GET
    path: /fanout?count=4000000
    weight: 0.15
  - name: io
    group: io
    method: GET
    path: /io
    weight: 0.10
  - name: mem
    group: mem
    method: GET
    path: /mem?size=10mb
    weight: 0.10
