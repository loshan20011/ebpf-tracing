apiVersion: autoscaling.fyp.io/v1alpha1
kind: ServiceSLO
metadata:
  name: sockshop-front-end-checkout-slo
  namespace: sock-shop
spec:
  targetDeployment: front-end
  sloLatency: 120
  minReplicas: 1
  maxReplicas: 10
---
apiVersion: autoscaling.fyp.io/v1alpha1
kind: ServiceSLO
metadata:
  name: sockshop-carts-checkout-slo
  namespace: sock-shop
spec:
  targetDeployment: carts
  sloLatency: 100
  minReplicas: 1
  maxReplicas: 5
---
apiVersion: autoscaling.fyp.io/v1alpha1
kind: ServiceSLO
metadata:
  name: sockshop-orders-checkout-slo
  namespace: sock-shop
spec:
  targetDeployment: orders
  sloLatency: 120
  minReplicas: 1
  maxReplicas: 8
