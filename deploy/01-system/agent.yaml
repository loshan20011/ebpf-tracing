apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bpf-agent
  namespace: thrive-scale
  labels:
    app: bpf-agent
spec:
  selector:
    matchLabels:
      app: bpf-agent
  template:
    metadata:
      labels:
        app: bpf-agent
    spec:
      serviceAccountName: bpf-agent-sa 
      hostPID: true
      hostNetwork: true
      containers:
      - name: bpf-agent
        image: loshans/bpf-agent:v1
        imagePullPolicy: Never
        command: ["python3", "-u", "agent.py"]
        env:
        - name: TARGET_NAMESPACE     
          value: "sock-shop"
        - name: RUNQ_MIN_US
          value: "250"
        - name: RAW_BUFFER_MAX_EVENTS
          value: "100000"
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        securityContext:
          privileged: true
          capabilities:
            add: ["SYS_ADMIN"]
        volumeMounts:
        # Mount the Kernel Headers and Debug FS so bpftrace works
        - name: lib-modules
          mountPath: /lib/modules
          readOnly: true
        - name: usr-src
          mountPath: /usr/src
          readOnly: true
        - name: debug-fs
          mountPath: /sys/kernel/debug
        - name: cgroup
          mountPath: /sys/fs/cgroup
      volumes:
      - name: lib-modules
        hostPath:
          path: /lib/modules
      - name: usr-src
        hostPath:
          path: /usr/src
      - name: debug-fs
        hostPath:
          path: /sys/kernel/debug
      - name: cgroup
        hostPath:
          path: /sys/fs/cgroup
---
apiVersion: v1
kind: Service
metadata:
  name: bpf-agent       
  namespace: thrive-scale
spec:
  type: ClusterIP
  selector:
    app: bpf-agent      
  ports:
    - protocol: TCP
      port: 5000        
      targetPort: 5000  
