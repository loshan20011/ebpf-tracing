# Practical SLOs for Sock Shop stateless application services.
# The intent is:
# - front-end is the main user-facing trigger
# - selected internal stateless services are secondary monitored services
# - stateful databases and middleware are intentionally excluded from autoscaling targets

apiVersion: autoscaling.fyp.io/v1alpha1
kind: ServiceSLO
metadata:
  name: sockshop-front-end-slo
  namespace: sock-shop
spec:
  targetDeployment: front-end
  priority: primary
  sloLatency: 400
  minReplicas: 1
  maxReplicas: 6
---
apiVersion: autoscaling.fyp.io/v1alpha1
kind: ServiceSLO
metadata:
  name: sockshop-catalogue-slo
  namespace: sock-shop
spec:
  targetDeployment: catalogue
  priority: secondary
  sloLatency: 180
  minReplicas: 1
  maxReplicas: 5
---
apiVersion: autoscaling.fyp.io/v1alpha1
kind: ServiceSLO
metadata:
  name: sockshop-carts-slo
  namespace: sock-shop
spec:
  targetDeployment: carts
  priority: secondary
  sloLatency: 160
  minReplicas: 1
  maxReplicas: 5
---
apiVersion: autoscaling.fyp.io/v1alpha1
kind: ServiceSLO
metadata:
  name: sockshop-orders-slo
  namespace: sock-shop
spec:
  targetDeployment: orders
  priority: secondary
  sloLatency: 220
  minReplicas: 1
  maxReplicas: 5
---
apiVersion: autoscaling.fyp.io/v1alpha1
kind: ServiceSLO
metadata:
  name: sockshop-user-slo
  namespace: sock-shop
spec:
  targetDeployment: user
  priority: secondary
  sloLatency: 180
  minReplicas: 1
  maxReplicas: 4
---
apiVersion: autoscaling.fyp.io/v1alpha1
kind: ServiceSLO
metadata:
  name: sockshop-payment-slo
  namespace: sock-shop
spec:
  targetDeployment: payment
  priority: secondary
  sloLatency: 120
  minReplicas: 1
  maxReplicas: 4
---
apiVersion: autoscaling.fyp.io/v1alpha1
kind: ServiceSLO
metadata:
  name: sockshop-shipping-slo
  namespace: sock-shop
spec:
  targetDeployment: shipping
  priority: secondary
  sloLatency: 140
  minReplicas: 1
  maxReplicas: 4
